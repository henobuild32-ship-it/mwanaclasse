@if (erreur()) {
  <div class="formulaire-erreur" role="alert">{{ erreur() }}</div>
}

<form (ngSubmit)="ajouter()">
  <div class="champ">
    <label for="code-enfant">Code de l'enfant *</label>
    <input
      id="code-enfant"
      name="codeEnfant"
      required
      minlength="6"
      maxlength="32"
      placeholder="MC-ELV-XXXXXX"
      [(ngModel)]="codeEnfant"
      autocomplete="off"
    />
    <span class="champ__aide">Imprimé sur la fiche de rentrée de l'élève.</span>
  </div>

  <div class="champ">
    <label for="relation">Votre relation</label>
    <select id="relation" name="relation" [(ngModel)]="relation">
      @for (r of relations; track r) {
        <option [value]="r">{{ r }}</option>
      }
    </select>
  </div>
</form>
