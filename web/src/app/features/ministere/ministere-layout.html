<header class="bandeau-haut" role="banner">
  <div class="bandeau-haut__interieur">
    <a class="marque" routerLink="/ministere" aria-label="Accueil Ministère">
      <img class="marque__logo" src="logo-mwana-classe.png" alt="" />
      <span>MwanaClasse</span>
    </a>

    <div class="bandeau-actions">
      <span class="etat-reseau" [class.etat-reseau--hors-ligne]="!connectivite.enLigne()" aria-label="État de la connexion" title="État de la connexion"></span>

      <div class="dropdown">
        <button class="btn btn--discret btn--ligne profil-bouton" (click)="toggleMenu(); $event.stopPropagation()" [aria-expanded]="menuOuvert()" aria-haspopup="true" aria-label="Ouvrir le menu du profil">
          <span class="avatar avatar--ministere" style="width:32px;height:32px;font-size:0.85rem;">🏛️</span>
        </button>
        @if (menuOuvert()) {
          <div class="dropdown__menu" role="menu">
            <div class="dropdown__item" role="menuitem">
              <strong>Ministère de l’EPST</strong>
              <span style="font-size:0.75rem;color:var(--mc-texte-2);margin-left:auto;">Kinshasa</span>
            </div>
            <div class="dropdown__separateur"></div>
            <button class="dropdown__item" role="menuitem" (click)="router.navigate(['/ministere/parametres'])">
              ⚙️ Paramètres
            </button>
            <button class="dropdown__item dropdown__item--danger" role="menuitem" (click)="deconnexion()">
              🚪 Déconnexion
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>

@if (rappelMotDePasse()) {
  <div class="rappel-securite" role="status">
    🔐 Pour votre sécurité, changez le mot de passe dans <a routerLink="/ministere/parametres">Paramètres</a>.
  </div>
}

<nav class="navigation" aria-label="Navigation espace Ministère">
  @for (o of onglets; track o.chemin) {
    <a
      class="navigation__lien"
      [routerLink]="o.chemin"
      routerLinkActive="navigation__lien--actif"
      [routerLinkActiveOptions]="{ exact: o.chemin === '/ministere' }"
    >
      <span class="navigation__icone">{{ o.icone }}</span>
      <span>{{ o.libelle }}</span>
    </a>
  }
</nav>

<main class="encadre-navigation">
  <router-outlet />
</main>

<app-toast-container />
